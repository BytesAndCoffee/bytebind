# Example ByteBind Authority configuration. Every value is validated at startup.

[authority]
attest_url = "https://authority.example-tailnet.ts.net:8443"   # browser-facing attestation endpoint
database = "/var/lib/bytebind/authority.sqlite3"               # only the Authority opens this
tailscale_socket = "/var/run/tailscale/tailscaled.sock"
attest_window = 30          # seconds from transaction creation to attestation (at most 30)
redeem_window = 10          # seconds from attestation to redemption (at most 10)
max_pending_per_rp = 200

# Separate private listener for passkey registration, management, and step-up.
[person]
origin = "https://authority.example-tailnet.ts.net:8444"
enrollment_tags = ["tag:bytebind-enrollment"]
self_enrollment = false

# A relying party on the same host: control over the Unix socket, identified by its user ID.
[[rp]]
id = "manage-app"
origin = "https://app.example.com"
audiences = ["manage"]
unix_uid = 998
grant_ttl = 180             # seconds; RP leases never outlast it (at most 300)
claims = ["device_id", "person_subject"]  # pairwise person identity only when requested
assurances = ["device", "verification"]
person_max_age = 300
authorization = ["manage:read"]

[rp.policy]
tags = ["tag:mgmt"]
tag_match = "any"           # "any" or "all" of the tags
nodes = []                  # optional stable node IDs that must also match

# A relying party on another tailnet node: control over HTTPS, identified by its node.
[[rp]]
id = "ops-console"
origin = "https://ops.example.com"
audiences = ["ops"]
tailnet_node = "nOpsConsoleCNTRL"
authorization = ["ops:write"]

[rp.policy]
tags = ["tag:mgmt", "tag:ops"]
tag_match = "all"

# Install as an nginx http{} include (e.g. /etc/nginx/conf.d/bytebind-demo.conf).
# Replace demo.example.com and certificate paths with your actual HTTPS site.
server {
    listen 80;
    server_name demo.example.com;
    return 308 https://demo.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_cache off;
        # Keep ByteBind's 401 sign-in HTML intact.
        proxy_intercept_errors off;
    }
}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytebind"
version = "0.7.0"
description = "Reference implementation of ByteBind: binding public web sessions to live presence on a private overlay network"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bytes & Coffee Digital Studio" }]
dependencies = [
  "cryptography>=44",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
flask = ["flask>=3"]
dev = ["flask>=3", "httpx>=0.28", "pytest>=8"]

[project.scripts]
bytebind-authority = "bytebind.authority:main"
bytebind-demo = "bytebind.demo:main"

[tool.hatch.build.targets.sdist]
# The demo videos and PDF are tens of megabytes; keep them out of the source distribution.
exclude = ["docs/*.mp4", "docs/*.pdf"]

[tool.hatch.build.targets.wheel]
packages = ["src/bytebind"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
